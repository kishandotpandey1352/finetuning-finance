apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: finance-llm-api-rules
  namespace: finance-ai
  labels:
    app.kubernetes.io/name: finance-llm-api
    app.kubernetes.io/part-of: finance-llm-platform
    release: prometheus
spec:
  groups:
    - name: finance-llm-api.rules
      rules:
        - alert: FinanceLLMApiHighErrorRate
          expr: |
            sum(rate(finance_api_requests_total{status="error"}[5m]))
            /
            clamp_min(sum(rate(finance_api_requests_total[5m])), 1)
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Finance LLM API high error rate"
            description: "More than 5% of Finance LLM API requests are failing."

        - alert: FinanceLLMApiSlowGeneration
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(finance_model_generation_latency_seconds_bucket[5m])) by (le)
            ) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Finance LLM API slow generation latency"
            description: "95th percentile model generation latency is above 10 seconds."

        - alert: FinanceLLMApiNoTraffic
          expr: |
            sum(rate(finance_api_requests_total[15m])) == 0
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Finance LLM API has no traffic"
            description: "No Finance LLM API requests were observed for 15 minutes."