apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
  namespace: finance-ai
  labels:
    app.kubernetes.io/name: gpu-smoke-test
    app.kubernetes.io/part-of: finance-llm-platform
    app.kubernetes.io/component: gpu-validation
spec:
  restartPolicy: Never
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  containers:
    - name: cuda
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      command: ["bash", "-lc"]
      args:
        - |
          echo "=== NVIDIA SMI ==="
          nvidia-smi
          echo "=== GPU DEVICE FILES ==="
          ls -la /dev/nvidia* || true
          echo "GPU smoke test completed."
      resources:
        limits:
          nvidia.com/gpu: 1
