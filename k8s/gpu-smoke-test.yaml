apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
  namespace: finance-ai
  labels:
    app.kubernetes.io/name: gpu-smoke-test
    app.kubernetes.io/part-of: finance-llm-platform
spec:
  restartPolicy: Never
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  nodeSelector:
    accelerator: nvidia
  containers:
    - name: cuda
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1